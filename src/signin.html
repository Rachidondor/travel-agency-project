  <header>
    <nav class="navbar navbar-expand-lg  fixed-top">
      <div class="container">
        <a class="navbar-brand" href="index.html"><img src="images/logo.png" alt="photo">
          سفرني
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarSupportedContent">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">

              <button class="nav-link dropdown-toggle" type="button" data-bs-toggle="dropdown" aria-expanded="false">

              <ul class="dropdown-menu">

<main>
    <section class="sign">
        <div class="container">
            <div class="row">
                <div class="col-lg-6 d-none d-lg-block"></div>
                <div class="col-lg-6">
                    <div class="sign-title"><h2>تسجيل الدخول إلى حسابك:</h2></div>
                    <div class="sign-forme">
                        <form class="d-flex flex-column gap-3">
                            <label for="email" class="visually-hidden">البريد الإلكتروني:</label>
                            <input type="email" id="email" placeholder="ادخل الايميل أو اسم المستخدم" required>
                            <label for="password" class="visually-hidden">كلمة المرور:</label>
                            <input type="password" id="password" placeholder="ادخل كلمة المرور" required>
                            <button type="submit">تسجيل الدخول</button>
                        </form>
                        <a href="signup.html">نسيت كلمة المرور؟</a>
                    </div>
                </div>
            </div>
        </div>
    </section>
</main>

        <div class="clear-fix">
          <div id="copyright" class="float-start footer-text">
                           
          </div>
